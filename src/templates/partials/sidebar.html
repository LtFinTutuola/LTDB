<aside id="sidebar" class="sidebar">
  <!-- Expanded header: logo + brand name -->
  <div class="sidebar__header">
    <div class="sidebar__brand">
      <img src="/static/assets/logo.png" alt="La Triestina" class="sidebar__logo-img">
      <span class="sidebar__logo-text">La Triestina</span>
    </div>
  </div>

  <!-- Navigation -->
  <div class="sidebar__top">
    <nav class="sidebar__nav">
      <a href="/vendite"
        class="sidebar__nav-item {% if active_page == 'vendite' %}sidebar__nav-item--active{% endif %}">
        <span class="material-symbols-rounded">point_of_sale</span>
        <span class="sidebar__nav-label">Vendite</span>
      </a>
      <a href="/magazzino" class="sidebar__nav-item {% if active_page == 'magazzino' or active_page == 'dashboard' %}sidebar__nav-item--active{% endif %}">
        <span class="material-symbols-rounded">inventory_2</span>
        <span class="sidebar__nav-label">Magazzino</span>
      </a>
      <a href="/brands"
        class="sidebar__nav-item {% if active_page == 'brands' %}sidebar__nav-item--active{% endif %}">
        <span class="material-symbols-rounded">style</span>
        <span class="sidebar__nav-label">Brands</span>
      </a>
      <a href="/categories"
        class="sidebar__nav-item {% if active_page == 'categories' %}sidebar__nav-item--active{% endif %}">
        <span class="material-symbols-rounded">category</span>
        <span class="sidebar__nav-label">Categorie</span>
      </a>
    </nav>

  </div>

  <!-- Bottom: action buttons on the left + user chip on the right -->
  <div class="sidebar__bottom">
    <div class="sidebar__bottom-left">
      {% if not current_user or current_user.role == 'admin' %}
      <a href="/settings" class="sidebar__action-btn {% if active_page == 'settings' %}sidebar__action-btn--active{% endif %}" title="Impostazioni">
        <span class="material-symbols-rounded">settings</span>
      </a>
      {% endif %}
      <button type="button" class="sidebar__action-btn" id="user-change-password-btn" title="Modifica password">
        <span class="material-symbols-rounded">key</span>
      </button>
      <button type="button" class="sidebar__action-btn" id="user-logout-btn" title="Esci">
        <span class="material-symbols-rounded">logout</span>
      </button>
    </div>
    <div class="sidebar__user-wrapper" title="{% if current_user %}{{ current_user.username }}{% if current_user.role == 'admin' %} (admin){% endif %}{% else %}admin{% endif %}">
      <div class="chip chip--admin">
        <span class="chip__username">{% if current_user %}{{ current_user.username }}{% if current_user.role == 'admin' %} (admin){% endif %}{% else %}admin{% endif %}</span>
      </div>
    </div>
  </div>
</aside>
