<aside id="sidebar" class="sidebar">
  <!-- Expanded header: logo + brand name -->
  <div class="sidebar__header">
    <div class="sidebar__brand">
      <img src="/static/assets/logo.png" alt="La Triestina" class="sidebar__logo-img">
      <span class="sidebar__logo-text">La Triestina</span>
    </div>
  </div>

  <!-- Navigation -->
  <div class="sidebar__top">
    <nav class="sidebar__nav">
      <a href="/vendite"
        class="sidebar__nav-item {% if active_page == 'vendite' %}sidebar__nav-item--active{% endif %}">
        <span class="material-symbols-rounded">point_of_sale</span>
        <span class="sidebar__nav-label">Vendite</span>
      </a>
      <a href="/magazzino" class="sidebar__nav-item {% if active_page == 'magazzino' or active_page == 'dashboard' %}sidebar__nav-item--active{% endif %}">
        <span class="material-symbols-rounded">inventory_2</span>
        <span class="sidebar__nav-label">Magazzino</span>
      </a>
      <a href="/brands"
        class="sidebar__nav-item {% if active_page == 'brands' %}sidebar__nav-item--active{% endif %}">
        <span class="material-symbols-rounded">style</span>
        <span class="sidebar__nav-label">Brands</span>
      </a>
      <a href="/categories"
        class="sidebar__nav-item {% if active_page == 'categories' %}sidebar__nav-item--active{% endif %}">
        <span class="material-symbols-rounded">category</span>
        <span class="sidebar__nav-label">Categorie</span>
      </a>
    </nav>

  </div>

  <!-- Bottom: settings + admin chip (inverted) -->
  <div class="sidebar__bottom">
    <a href="/settings" class="sidebar__settings-btn {% if active_page == 'settings' %}sidebar__settings-btn--active{% endif %}" title="Impostazioni">
      <span class="material-symbols-rounded">settings</span>
    </a>
    <div class="chip chip--admin">admin</div>
  </div>
</aside>
