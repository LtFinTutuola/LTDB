<!DOCTYPE html>
<html lang="it">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}LTDB{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css">
  {% block extra_head %}{% endblock %}
</head>
<body>

  {% block scripts %}{% endblock %}

</body>
</html>
